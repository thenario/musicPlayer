# SonarQube 扫描配置
# token 不要写进本文件（会进 git 历史导致泄露）。扫描时通过环境变量提供：
#   SONAR_TOKEN=xxx sonar-scanner           （SonarScanner 自动读取 SONAR_TOKEN）
#   或  sonar-scanner -Dsonar.token=xxx
sonar.projectKey=musicPlayer
sonar.projectName=musicPlayer
sonar.host.url=http://localhost:9000

sonar.sources=web, backend

sonar.inclusions=**/*.java, **/*.ts, **/*.tsx, **/*.js, **/*.jsx, **/*.vue

sonar.exclusions=**/node_modules/**, **/dist/**, **/build/**, **/public/**, **/*.test.ts, **/*.spec.ts

sonar.sourceEncoding=UTF-8
