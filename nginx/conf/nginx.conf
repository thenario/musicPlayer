
#user  nobody;
worker_processes  1; #工作进程数量，一般几核就是几，使用auto可以自动设置
#error_log  [日志文件路径]  [日志级别]，nginx一般已经有了设置，所以这里默认注释
#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;
#记录着主进程号，因为是主进程控制工作进程，所以需要向主进程发送指令控制工作进程
#pid        logs/nginx.pid;

#允许每一个工作进程同时处理的最大并发连接数，这里是1024，每一个工作进程乘上单进程最大连接数就是总并发能力
events {
    worker_connections  1024;
}

#配置所有和web网站，http协议，网页访问相关的配置
http {
    #把这个路径下的内容引入到当前位置
    #mime类型是一种标准，用于解释文件类型
    include       /etc/nginx/mime.types;
    #当上面的类型说明无法解释文件时就默认为application/octet-stream，任意的二进制文件流
    #浏览器收到二进制文件流时会触发下载操作
    default_type  application/octet-stream;
    #这里是日志模板，$后面的是nginx的内置变量，main指模板名字
    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';
    
    #访问日志，日志路径，格式名字
    #access_log  logs/access.log  main;

    #开启的话不用经过nginx直接有磁盘传输到网卡发送
    sendfile        on;
    
    #当要发送的数据达到一个mss时才进行数据传输
    #tcp_nopush     on;

    #keepalive_timeout  0;
    #当用户看完一个网页后，Nginx会让这个网络连接在后台默默维持65秒，
    #如果65秒内这个用户没有再点开网站的其他页面Nginx会彻底关闭这个连接
    keepalive_timeout  65;#单位是秒

    #限制用户上传文件的大小上限
    client_max_body_size 10M;

    gzip_static on;#前置拦截，如果已经有了gzip压缩包直接传输

    gzip on;#开启gzip，如果没有找到压缩包就当场压缩
    gzip_comp_level 6;#压缩率，这个值性价比最高，压缩的越小越消耗cpu
    gzip_min_length 1k;#压缩门槛，高于才压缩，单位是字节，这里是1KB
    gzip_buffers 4 16k;#像系统申请4*16KB的临时内存作为压缩用的缓存
    gzip_http_version 1.1;#只有当用户的浏览器支持HTTP/1.1及以上协议时才启用压缩
    gzip_vary on;#在发给浏览器的响应头里加上一句Vary: Accept-Encoding，表示这是一个压缩包

    #除了默认html类型外也要被压缩的文件类型
    gzip_types 
        text/plain#纯文本
        text/css#样式表
        application/json#json数据
        application/javascript#js脚本
        application/x-javascript#js脚本
        text/javascript#js脚本，因为名字可能有偏差，所以写上所有三种
        text/xml#xml
        application/xml#xml 
        application/xml+rss#xml 
        image/svg+xml;#矢量图片

    server {
        listen       80;#监听80端口
        server_name  localhost; #域名

        #charset koi8-r; #解码格式，这是俄文，，默认是utf-8

        #access_log  logs/host.access.log  main;

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;

            if ($request_filename ~* .*\.(html|htm)$ ) {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }

        location /api/ {
            proxy_pass http://backend-server:8080; #末尾没有斜杠，不舍弃，全部拼接
            proxy_set_header Host $host; #传入浏览器里的原来的header
            proxy_set_header X-Real-IP $remote_addr; #原真是外网ip地址
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; #每经过一层代理就追加
        }

        location /static/ {
            #静态资源转发到后端（Spring Boot 的 /static/** resource handler 提供，支持 Range 断点续传）
            proxy_pass http://backend-server:8080; #末尾没有斜杠，不舍弃，全部拼接
            proxy_set_header Host $host; #传入浏览器里的原来的header
            proxy_set_header X-Real-IP $remote_addr; #真实外网ip地址
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; #每经过一层代理就追加
            expires 7d;
        }


        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }


    # another virtual host using mix of IP-, name-, and port-based configuration
    #
    #server {
    #    listen       8000;
    #    listen       somename:8080;
    #    server_name  somename  alias  another.alias;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}


    # HTTPS server
    #
    #server {
    #    listen       443 ssl;
    #    server_name  localhost;

    #    ssl_certificate      cert.pem;
    #    ssl_certificate_key  cert.key;

    #    ssl_session_cache    shared:SSL:1m;
    #    ssl_session_timeout  5m;

    #    ssl_ciphers  HIGH:!aNULL:!MD5;
    #    ssl_prefer_server_ciphers  on;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}

}
