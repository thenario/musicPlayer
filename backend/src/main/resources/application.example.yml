# =====================================================================
#  后端配置示例（application.example.yml）
#  复制为 application.yml 使用，或仅参照此文件设置环境变量。
#  数据库连接、Redis 地址和密码、JWT 密钥必须由外部配置提供，使用 ${VAR}。
#  Redis 未启用认证时，显式提供空密码。
#  通用设置使用 ${VAR:default}，未提供变量时采用默认值。
# =====================================================================

server:
  # 服务端口。本地直连后端时前端 /api 代理指向该端口
  port: ${SERVER_PORT:8080}

spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  application:
    name: server
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 105MB
  output:
    ansi:
      enabled: always

  jackson:
    property-naming-strategy: SNAKE_CASE

  flyway:
    # 已有数据库自动登记为 V1；后续仅新增 V{版本}__{说明}.sql，勿修改已执行版本。
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  datasource:
    # 在 backend/.env 或 Compose 中提供连接地址和用户名。
    url: ${SPRING_DATASOURCE_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}   # 必填：仅通过环境变量提供
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    root: info
    "com.kyf.mp.server": ${APP_LOG_LEVEL:info}
  pattern:
    console: ">> [MY-MUSIC-APP] %d{HH:mm:ss} %clr(%5p) %clr(---){faint} %clr(%logger{36}){cyan} %clr(:){faint} %clr(%m){green}%n"

jwt:
  secret: ${JWT_SECRET}   # 必填：至少 32 字节，仅通过环境变量提供
  expire: ${JWT_EXPIRE:86400000}     # 毫秒；86400000 = 1 天

file:
  # 上传文件的落盘路径（容器内路径；宿主机对应 static/，由 Docker 卷挂载）
  upload:
    song-path: ${SONG_UPLOAD_PATH:/app/static/songs/}
    song-cover-path: ${SONG_COVER_UPLOAD_PATH:/app/static/song_covers/}
    playlist-cover-path: ${PLAYLIST_COVER_UPLOAD_PATH:/app/static/playlist_covers/}
    user-cover-path: ${USER_COVER_UPLOAD_PATH:/app/static/user_covers/}
  # 对外暴露的静态资源 URL 前缀（与 nginx location /static/ 对应）
  static:
    song-url: ${SONG_STATIC_URL:/static/songs/}
    song-cover-url: ${SONG_COVER_STATIC_URL:/static/song_covers/}
    playlist-cover-url: ${PLAYLIST_COVER_STATIC_URL:/static/playlist_covers/}
    user-cover-url: ${USER_COVER_STATIC_URL:/static/user_covers/}

cors:
  # 逗号分隔；部署到独立前端域名时通过 CORS_ALLOWED_ORIGINS 覆盖。
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

mybatis-plus:
  mapper-locations: classpath*:com/kyf/mp/server/modules/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

song:
  page-size: ${SONG_PAGE_SIZE:15}
  # 启动时扫描磁盘歌曲并写入数据库；有明确初始化需求时再设为 true。
  scanner:
    enabled: ${SONG_SCANNER_ENABLED:false}
    uploader-id: ${SONG_SCANNER_UPLOADER_ID:0}
    remove-missing: ${SONG_SCANNER_REMOVE_MISSING:false}

auth:
  login:
    # 单个账号在窗口内允许的登录尝试次数；超限返回 429。
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    # 限流窗口（秒）。Redis 不可用时会降级放行并记录告警。
    window-seconds: ${LOGIN_WINDOW_SECONDS:900}
queue:
  max-per-user: ${QUEUE_MAX_PER_USER:5}
