services:
  #services里的这个名字对应着局部域名
  db:
    #镜像名称
    image: mysql:8.0
    #容器名称
    container_name: music-db
    #总是重启
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}"
      MYSQL_DATABASE: "musicPlayer"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306" #映射到宿主机，供本地裸跑后端连接（docker 内部仍走 db 服务名）
    volumes:
      #容器内部的数据持久化到宿主机
      - ./mysql/data:/var/lib/mysql
      #建表
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [
          "CMD", #表示这是一条调用系统内核的指令，不启动额外shell
          "mysqladmin", #专门用来检查mysql服务器配置
          "ping", #pingmysql看看是否能正常相应
          "-h", #表示主机地址
          "localhost", #代表本地数据库
          "-u", #表示user
          "root", #以root登录
          "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}", #密码
        ]
      interval: 10s #间隔时间
      timeout: 5s #最大尝试时间
      retries: 5 #允许的重试次数，超过仍然为成功就标记成非健康

  redis:
    image: redis:7-alpine
    container_name: music-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend-server:
    build:
      #使用指定目录下的dockerfile构建镜像
      context: .
      dockerfile: backend/Dockerfile
    #容器名称
    container_name: music-app
    #容器终止运行后总是重启
    restart: always
    depends_on:
      db:
        condition: service_healthy #健康检查，运行db下的healthcheck
      redis:
        condition: service_healthy
    environment:
      #连接数据库，协议（类似于https），后面是服务名加端口，再后面是数据库名+时区+编码设置，？连接参数，用&连接参数
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/musicPlayer?serverTimezone=GMT%2B8&characterEncoding=utf-8
      MYSQL_USER: root
      MYSQL_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env}"
      SPRING_DATA_REDIS_HOST: redis
      SONG_SCANNER_ENABLED: "${SONG_SCANNER_ENABLED:-false}"
      SONG_SCANNER_UPLOADER_ID: "${SONG_SCANNER_UPLOADER_ID:-0}"
      TZ: Asia/Shanghai #时区
    volumes:
      - ./static:/app/static #挂载，存歌曲，封面的路径

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: music-nginx #容器名称，在log时指定容器
    restart: always #容器停止之后无条件重新启动
    ports:
      - "8080:80" #宿主机端口：容器端口， - 这个表示此处的参数可以是一个列表
    depends_on:
      - backend-server #表示这个容器启动之后它才会启动
    environment: #环境变量
      TZ: Asia/Shanghai #时区
    volumes:
      #地址映射，将宿主机的目录映射到虚拟环境
      #上传的静态资源（歌曲/封面）由 nginx 直接读取，性能更好；后端 StaticResourceConfig 仅作兜底
      - ./static:/usr/share/nginx/static:ro
