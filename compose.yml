services:
  db:
    image: mysql:8.0
    container_name: music-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "musicPlayer"
      MYSQL_USER: music_app
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD}"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
    healthcheck:
      test: [
          "CMD", 
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: music-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-server:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: music-app
    ports:
    - "8080:8080"
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/musicPlayer?serverTimezone=GMT%2B8&characterEncoding=utf-8
      MYSQL_USER: music_app
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      SPRING_DATA_REDIS_HOST: redis
      SONG_SCANNER_ENABLED: "${SONG_SCANNER_ENABLED}"
      SONG_SCANNER_UPLOADER_ID: "${SONG_SCANNER_UPLOADER_ID}"
      TZ: Asia/Shanghai
    volumes:
      - ./static:/app/static

  nginx:
    build:
      context: ./web
      dockerfile: dockerfile
    container_name: music-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend-server
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./static:/usr/share/nginx/static:ro
